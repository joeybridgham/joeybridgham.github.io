<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Series 7 Daily Ten | Joey Bridgham</title>
<meta name="description" content="Ten Series 7 practice questions a day, with an explanation after each answer and a streak counter.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Series 7">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Same visual system as the portfolio home page: black field, blue accent, serif type, pill buttons.
   Layout: one narrow column sized for a phone; home, quiz and results are swapped inside #app. */
:root{
  color-scheme:dark;
  --bg:#000;
  --surface:rgba(255,255,255,.045);
  --surface-2:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.09);
  --border-strong:rgba(255,255,255,.22);
  --text:#f7f7f9;
  --text-dim:#bcc0c7;
  --text-faint:#8c9099;
  --accent:#2997ff;
  --accent-soft:rgba(41,151,255,.14);
  --good:#30d158;
  --good-soft:rgba(48,209,88,.13);
  --bad:#ff6b61;
  --bad-soft:rgba(255,107,97,.13);
  --streak:#ffb340;
  --radius:22px;
  --ease:cubic-bezier(.22,1,.36,1);
  --serif:"Times New Roman",Times,Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:
    radial-gradient(ellipse 90% 38% at 50% 0%,rgba(41,151,255,.11),transparent 70%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text);
  font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  line-height:1.5;
  font-size:17px;
  overflow-x:hidden;
}
::selection{background:var(--accent);color:#000}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- NAV (matches the portfolio) ---------- */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding-top:env(safe-area-inset-top);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  background:rgba(0,0,0,.6);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.nav-inner{
  max-width:1100px;margin:0 auto;
  padding:0 max(20px,env(safe-area-inset-right)) 0 max(20px,env(safe-area-inset-left));
  height:52px;display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.nav-name{font-weight:600;font-size:15px;letter-spacing:-.01em;color:var(--text);text-decoration:none}
.nav-back{color:var(--text-dim);text-decoration:none;font-size:13px;letter-spacing:.01em}
.nav-back:hover{color:var(--text)}

/* ---------- SHELL ---------- */
.wrap{
  max-width:620px;margin:0 auto;
  padding:calc(52px + 28px + env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:22px;
}
.eyebrow{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
h1{font-size:clamp(34px,9vw,46px);font-weight:700;letter-spacing:-.025em;line-height:1.06;text-wrap:balance}
.lede{color:var(--text-dim);font-size:17px;max-width:34em}
.head{display:flex;flex-direction:column;gap:10px}

.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  min-height:54px;padding:14px 26px;border-radius:980px;
  font-size:18px;font-weight:600;text-align:center;
  transition:transform .3s var(--ease),box-shadow .3s,background .3s,opacity .2s;
}
.btn-primary{background:var(--accent);color:#000}
.btn-primary:hover{box-shadow:0 8px 32px rgba(41,151,255,.4)}
.btn-primary:active{transform:scale(.98)}
.btn-primary[disabled]{background:var(--surface-2);color:var(--text-faint);cursor:default;box-shadow:none}
.btn-ghost{color:var(--text);border:1px solid var(--border-strong);background:rgba(255,255,255,.03)}
.btn-ghost:hover{background:rgba(255,255,255,.1)}
.btn-row{display:flex;flex-direction:column;gap:12px}
.link-btn{color:var(--text-faint);font-size:14px;text-decoration:underline;text-underline-offset:3px;align-self:center;padding:8px}
.link-btn:hover{color:var(--text-dim)}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}

/* ---------- HOME: streak ticket ---------- */
.ticket{
  background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));
  border:1px solid var(--border);border-radius:var(--radius);
  display:flex;flex-direction:column;
}
.ticket-top{padding:26px 24px 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.streak{display:flex;align-items:baseline;gap:12px}
.streak-num{
  font-size:clamp(76px,24vw,104px);font-weight:700;line-height:.86;letter-spacing:-.04em;
  font-variant-numeric:tabular-nums;color:var(--streak);
}
.streak-num.zero{color:var(--text-faint)}
.streak-label{font-size:19px;color:var(--text);line-height:1.15}
.streak-label small{display:block;font-size:14px;color:var(--text-faint);margin-top:3px}
.week{display:flex;gap:7px}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;letter-spacing:.08em;color:var(--text-faint)}
.dot{
  width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;color:#000;
}
.day.done .dot{background:var(--streak);border-color:var(--streak)}
.day.today .dot{border-color:var(--accent);box-shadow:0 0 12px rgba(41,151,255,.45)}
.day.today.done .dot{border-color:var(--streak);box-shadow:0 0 12px rgba(255,179,64,.45)}
.day.today{color:var(--text)}
/* perforation between the two halves of the ticket */
.perf{height:0;border-top:1.5px dashed var(--border-strong);margin:0 14px;position:relative}
.perf::before,.perf::after{
  content:"";position:absolute;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--bg);
  border:1px solid var(--border);
}
.perf::before{left:-24px}
.perf::after{right:-24px}
.ticket-bottom{padding:20px 24px 24px;display:flex;flex-direction:column;gap:14px}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.field{display:flex;flex-direction:column;gap:2px;min-width:0}
.field dt{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}
.field dd{font-size:16px;color:var(--text);font-variant-numeric:tabular-nums}
.field dd.ok{color:var(--good)}
.ticks{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.tick{height:7px;border-radius:4px;background:var(--surface-2)}
.tick.on{background:var(--accent)}
.tick.good{background:var(--good)}
.tick.bad{background:var(--bad)}
.tick.now{background:var(--text)}

/* ---------- HOME: stats ---------- */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 16px}
.stat-num{font-size:30px;font-weight:700;letter-spacing:-.02em;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.1}
.stat-label{margin-top:4px;color:var(--text-dim);font-size:14px}
.section-title{font-size:21px;font-weight:600;letter-spacing:-.015em;display:flex;align-items:center;gap:12px}
.section-title::before{content:"";width:24px;height:2px;background:var(--accent);display:inline-block}
.topics{display:flex;flex-direction:column;gap:14px;list-style:none}
.topic-row{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:baseline;font-size:15.5px}
.topic-row .frac{color:var(--text-faint);font-variant-numeric:tabular-nums;font-size:14px}
.bar{grid-column:1 / -1;height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.bar i.low{background:var(--bad)}
.bar i.high{background:var(--good)}
.note{color:var(--text-faint);font-size:13.5px;line-height:1.55}
.note + .note{margin-top:8px}

/* ---------- QUIZ ---------- */
.quiz-top{display:flex;align-items:center;gap:14px}
.quiz-top .ticks{flex:1}
.close{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--border-strong);flex-shrink:0;
  font-size:20px;line-height:1;color:var(--text-dim);display:flex;align-items:center;justify-content:center;
}
.close:hover{color:var(--text);background:rgba(255,255,255,.08)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chip{
  font-size:12px;letter-spacing:.04em;color:var(--text-dim);border:1px solid rgba(255,255,255,.14);
  padding:4px 12px;border-radius:980px;background:rgba(255,255,255,.03);
}
.count{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.question{font-size:clamp(20px,5.4vw,23px);line-height:1.38;font-weight:600;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:11px;list-style:none}
.opt{
  width:100%;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;
  padding:15px 16px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);
  font-size:17.5px;line-height:1.4;color:var(--text);
  transition:border-color .2s,background .2s,transform .2s var(--ease);
}
.opt:hover:not([disabled]){border-color:var(--border-strong)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .letter{
  width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border-strong);
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--text-dim);
}
.opt .body{padding-top:5px;min-width:0;overflow-wrap:anywhere}
.opt .tag{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-top:4px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .letter{background:var(--accent);border-color:var(--accent);color:#000}
.opt[disabled]{cursor:default;color:var(--text-dim)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--text)}
.opt.right .letter{background:var(--good);border-color:var(--good);color:#000}
.opt.right .tag{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--text)}
.opt.wrong .letter{background:var(--bad);border-color:var(--bad);color:#000}
.opt.wrong .tag{color:var(--bad)}
.why{border-radius:18px;padding:18px 18px 20px;border:1px solid var(--border);background:var(--surface);border-left:4px solid var(--good)}
.why.miss{border-left-color:var(--bad)}
.why h2{font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:var(--good);margin-bottom:8px}
.why.miss h2{color:var(--bad)}
.why p{color:var(--text);font-size:17px;line-height:1.55}
.why p + p{margin-top:8px}
.why .ans{color:var(--text-dim)}

/* ---------- RESULTS ---------- */
.score{display:flex;align-items:baseline;gap:10px}
.score-num{font-size:clamp(72px,22vw,96px);font-weight:700;line-height:.9;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.score-of{font-size:26px;color:var(--text-faint)}
.pop{animation:pop .7s var(--ease) both}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.streak-line{display:flex;align-items:center;gap:10px;font-size:19px}
.streak-line b{color:var(--streak);font-size:24px;font-variant-numeric:tabular-nums}
.review{display:flex;flex-direction:column;gap:14px;list-style:none}
.review li{border-left:3px solid var(--bad);padding:2px 0 2px 14px}
.review .rq{font-size:16px;color:var(--text-dim)}
.review .ra{font-size:16px;color:var(--text);margin-top:4px}
.review .ra span{color:var(--good);font-weight:600}

@media (min-width:560px){
  .stats{grid-template-columns:repeat(4,1fr)}
  .btn-row.split{flex-direction:row}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>

<nav>
  <div class="nav-inner">
    <a class="nav-name" href="../">Joey Bridgham</a>
    <a class="nav-back" href="../">Back to portfolio</a>
  </div>
</nav>

<main class="wrap" id="app">
  <div class="head">
    <div class="eyebrow">Series 7 · Daily Ten</div>
    <h1>Ten questions a day.</h1>
    <p class="lede">Loading the question bank.</p>
  </div>
</main>

<noscript><p style="padding:100px 24px;text-align:center">This practice app needs JavaScript turned on.</p></noscript>

<script src="questions.js"></script>
<script>
(function () {
  'use strict';

  var BANK = window.S7_QUESTIONS || [];
  var GOAL = 10;
  var KEY = 's7daily.v1';
  var LETTERS = ['A', 'B', 'C', 'D'];
  var byId = {};
  BANK.forEach(function (q) { byId[q.id] = q; });

  var app = document.getElementById('app');
  var storageOK = true;
  var state = load();
  var view = 'home';
  var sel = null;          // index of the choice picked on screen, before it is checked
  var summary = null;      // last finished session, for the results view
  var confirmReset = false;

  /* ---------- storage ---------- */
  function blank() { return { v: 1, days: {}, q: {}, session: null, best: 0 }; }
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && s.v === 1 && s.days && s.q) return s;
    } catch (e) { storageOK = false; }
    return blank();
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); storageOK = true; }
    catch (e) { storageOK = false; }
  }

  /* ---------- dates and streak ---------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function dkey(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function today() { return dkey(new Date()); }
  function dayRec(k) { return state.days[k] || { n: 0, c: 0 }; }
  function isDone(k) { return dayRec(k).n >= GOAL; }
  function streak() {
    var d = new Date();
    if (!isDone(dkey(d))) d.setDate(d.getDate() - 1);
    var n = 0;
    while (isDone(dkey(d))) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  /* ---------- picking questions ---------- */
  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function accuracy(id) { var s = state.q[id]; return s ? s[1] / s[0] : 0; }
  function pickIds(n) {
    // New questions first, so the whole bank is covered before anything repeats.
    var unseen = [], seen = [];
    BANK.forEach(function (q) { (state.q[q.id] ? seen : unseen).push(q.id); });
    var ids = shuffle(unseen).slice(0, n);
    if (ids.length < n) {
      shuffle(seen).sort(function (a, b) { return accuracy(a) - accuracy(b); });
      ids = ids.concat(seen.slice(0, n - ids.length));
    }
    return shuffle(ids);
  }
  function missedIds() {
    return BANK.filter(function (q) { var s = state.q[q.id]; return s && s[2] === 0; })
               .map(function (q) { return q.id; });
  }
  function start(kind) {
    var ids;
    if (kind === 'missed') {
      ids = shuffle(missedIds()).slice(0, GOAL);
    } else {
      var left = GOAL - dayRec(today()).n;
      kind = left > 0 ? 'daily' : 'extra';
      ids = pickIds(left > 0 ? left : GOAL);
    }
    if (!ids.length) return;
    state.session = {
      date: today(), kind: kind, ids: ids,
      order: ids.map(function () { return shuffle([0, 1, 2, 3]); }),
      i: 0, res: []
    };
    sel = null; save(); view = 'quiz'; render(); window.scrollTo(0, 0);
  }
  function dropStaleSession() {
    if (state.session && state.session.date !== today()) { state.session = null; save(); }
  }

  /* ---------- answering ---------- */
  function check() {
    var s = state.session;
    if (!s || sel == null || s.res[s.i]) return;
    var id = s.ids[s.i];
    var ok = s.order[s.i][sel] === 0;      // choice 0 in the bank is always the correct one
    s.res[s.i] = { p: sel, ok: ok };
    var st = state.q[id] || [0, 0, 1];
    st[0]++; if (ok) st[1]++; st[2] = ok ? 1 : 0;
    state.q[id] = st;
    var k = today();
    var d = state.days[k] || { n: 0, c: 0 };
    d.n++; if (ok) d.c++;
    state.days[k] = d;
    var sk = streak();
    if (sk > (state.best || 0)) state.best = sk;
    save(); render();
    var go = document.getElementById('go');
    if (go) go.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function next() {
    var s = state.session;
    if (!s || !s.res[s.i]) return;
    if (s.i + 1 >= s.ids.length) {
      summary = { kind: s.kind, ids: s.ids, res: s.res };
      state.session = null; save(); view = 'done';
    } else {
      s.i++; sel = null; save();
    }
    render(); window.scrollTo(0, 0);
  }

  /* ---------- tiny DOM helper ---------- */
  function h(tag, attrs) {
    var e = document.createElement(tag), k, i, c;
    if (attrs) for (k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    for (i = 2; i < arguments.length; i++) {
      c = arguments[i];
      (Array.isArray(c) ? c : [c]).forEach(function (x) {
        if (x == null || x === false) return;
        e.appendChild(typeof x === 'string' ? document.createTextNode(x) : x);
      });
    }
    return e;
  }
  function ticks(total, fn) {
    var row = h('div', { class: 'ticks', 'aria-hidden': 'true' });
    row.style.gridTemplateColumns = 'repeat(' + total + ',1fr)';
    for (var i = 0; i < total; i++) row.appendChild(h('span', { class: 'tick ' + (fn(i) || '') }));
    return row;
  }
  function totals() {
    var n = 0, c = 0, seen = 0, k;
    for (k in state.q) { n += state.q[k][0]; c += state.q[k][1]; seen++; }
    return { n: n, c: c, seen: seen };
  }

  /* ---------- views ---------- */
  function renderHome() {
    dropStaleSession();
    var t = dayRec(today()), sk = streak(), tot = totals(), s = state.session;
    var doneToday = t.n >= GOAL;
    var answered = Math.min(t.n, GOAL);

    // last seven days, oldest first
    var week = h('div', { class: 'week', role: 'img', 'aria-label': 'Last seven days' });
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var done = isDone(dkey(d));
      week.appendChild(h('div', { class: 'day' + (done ? ' done' : '') + (i === 0 ? ' today' : '') },
        h('span', { class: 'dot', text: done ? '✓' : '' }),
        h('span', { text: 'SMTWTFS'.charAt(d.getDay()) })));
    }

    var status = doneToday ? 'Filled' : (t.n > 0 ? 'Partial fill' : 'Open');
    var ticket = h('section', { class: 'ticket', 'aria-label': 'Streak and today’s progress' },
      h('div', { class: 'ticket-top' },
        h('div', { class: 'streak' },
          h('div', { class: 'streak-num' + (sk === 0 ? ' zero' : ''), text: String(sk) }),
          h('div', { class: 'streak-label' }, 'day streak',
            h('small', { text: sk === 0 ? 'Finish 10 today to start one' : (doneToday ? 'Safe for today' : 'Finish 10 today to keep it') }))),
        week),
      h('div', { class: 'perf' }),
      h('div', { class: 'ticket-bottom' },
        h('dl', { class: 'fields' },
          h('div', { class: 'field' }, h('dt', { text: 'Order' }), h('dd', { text: answered + ' of ' + GOAL })),
          h('div', { class: 'field' }, h('dt', { text: 'Type' }), h('dd', { text: 'Day order' })),
          h('div', { class: 'field' }, h('dt', { text: 'Status' }), h('dd', { class: doneToday ? 'ok' : '', text: status }))),
        ticks(GOAL, function (i) { return i < answered ? 'on' : ''; })));

    var primary;
    if (s) {
      primary = h('button', { class: 'btn btn-primary', onclick: function () { sel = null; view = 'quiz'; render(); window.scrollTo(0, 0); },
        text: 'Continue, question ' + (Math.min(s.i + (s.res[s.i] ? 1 : 0), s.ids.length - 1) + 1) + ' of ' + s.ids.length });
    } else if (!doneToday) {
      primary = h('button', { class: 'btn btn-primary', onclick: function () { start('daily'); },
        text: t.n > 0 ? 'Finish today’s 10 (' + (GOAL - t.n) + ' left)' : 'Start today’s 10' });
    } else {
      primary = h('button', { class: 'btn btn-ghost', onclick: function () { start('extra'); }, text: 'Do 10 more (optional)' });
    }
    var missed = missedIds().length;
    var buttons = h('div', { class: 'btn-row' }, primary,
      missed && !s ? h('button', { class: 'btn btn-ghost', onclick: function () { start('missed'); },
        text: 'Review questions I missed (' + missed + ')' }) : null);

    var pct = tot.n ? Math.round(100 * tot.c / tot.n) + '%' : 'n/a';
    var stats = h('section', { class: 'stats', 'aria-label': 'Totals' },
      stat(String(tot.n), 'Questions answered'),
      stat(pct, 'Answered correctly'),
      stat(tot.seen + ' / ' + BANK.length, 'Of the bank seen'),
      stat(String(Math.max(state.best || 0, sk)), 'Longest streak'));

    var nodes = [
      h('div', { class: 'head' },
        h('div', { class: 'eyebrow', text: 'Series 7 · Daily Ten' }),
        h('h1', { text: doneToday ? 'Done for today.' : 'Ten questions a day.' }),
        h('p', { class: 'lede', text: doneToday
          ? 'Today’s ten are in. Extra questions are there if you want them, and they are optional.'
          : 'Ten random Series 7 questions, an explanation after each one, and a streak for every day you finish.' })),
      ticket, buttons, stats
    ];

    var topics = topicStats();
    if (topics.length) {
      nodes.push(h('h2', { class: 'section-title', text: 'Accuracy by topic' }));
      nodes.push(h('ul', { class: 'topics card' }, topics.map(function (x) {
        var p = Math.round(100 * x.c / x.n);
        return h('li', { class: 'topic-row' },
          h('span', { text: x.t }),
          h('span', { class: 'frac', text: x.c + ' of ' + x.n + ' · ' + p + '%' }),
          h('span', { class: 'bar' }, (function () {
            var b = h('i', { class: p < 60 ? 'low' : (p >= 80 ? 'high' : '') });
            b.style.width = Math.max(p, 3) + '%'; return b;
          })()));
      })));
    }

    var standalone = window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
    nodes.push(h('div', null,
      !standalone ? h('p', { class: 'note', text: 'On iPhone, tap Share and then Add to Home Screen to open this like an app.' }) : null,
      h('p', { class: 'note', text: storageOK
        ? 'Your streak and results are saved in this browser on this device.'
        : 'This browser is blocking storage, so your streak will not be saved. Turn off private browsing to keep it.' }),
      h('p', { class: 'note', text: 'Original practice questions, not affiliated with or endorsed by FINRA. Rules change, so check anything important against your study materials. The exam’s passing score is 72%.' })));

    if (tot.n) {
      nodes.push(h('button', { class: 'link-btn', onclick: function () {
        if (!confirmReset) { confirmReset = true; render(); return; }
        state = blank(); confirmReset = false; save(); render();
      }, text: confirmReset ? 'Tap again to erase your streak and results' : 'Reset progress' }));
    }
    return nodes;
  }
  function stat(num, label) {
    return h('div', { class: 'stat' }, h('div', { class: 'stat-num', text: num }), h('div', { class: 'stat-label', text: label }));
  }
  function topicStats() {
    var m = {}, out = [], k;
    for (k in state.q) {
      var q = byId[k]; if (!q) continue;
      var r = m[q.t] || (m[q.t] = { t: q.t, n: 0, c: 0 });
      r.n += state.q[k][0]; r.c += state.q[k][1];
    }
    for (k in m) out.push(m[k]);
    return out.sort(function (a, b) { return a.c / a.n - b.c / b.n || b.n - a.n; });
  }

  function renderQuiz() {
    var s = state.session;
    if (!s) { view = 'home'; return renderHome(); }
    var q = byId[s.ids[s.i]];
    if (!q) { state.session = null; save(); view = 'home'; return renderHome(); }
    var order = s.order[s.i], res = s.res[s.i];
    var picked = res ? res.p : sel;

    var opts = h('ol', { class: 'opts' }, order.map(function (orig, pos) {
      var cls = 'opt', tag = null;
      if (res) {
        if (orig === 0) { cls += ' right'; tag = pos === res.p ? 'Correct' : 'Correct answer'; }
        else if (pos === res.p) { cls += ' wrong'; tag = 'Your answer'; }
      } else if (pos === sel) cls += ' sel';
      return h('li', null, h('button', {
        class: cls, type: 'button', disabled: !!res,
        'aria-pressed': !res ? String(pos === sel) : null,
        onclick: function () { if (!s.res[s.i]) { sel = pos; render(); } }
      },
        h('span', { class: 'letter', text: res && orig === 0 ? '✓' : (res && pos === res.p ? '✕' : LETTERS[pos]) }),
        h('span', { class: 'body' }, q.c[orig], tag ? h('span', { class: 'tag', text: tag }) : null)));
    }));

    var labels = { daily: 'Today’s ten', extra: 'Extra practice', missed: 'Missed questions' };
    var nodes = [
      h('div', { class: 'quiz-top' },
        h('button', { class: 'close', type: 'button', 'aria-label': 'Save and go back to the home screen',
          onclick: function () { sel = null; view = 'home'; render(); window.scrollTo(0, 0); }, text: '✕' }),
        ticks(s.ids.length, function (i) {
          var r = s.res[i]; return r ? (r.ok ? 'good' : 'bad') : (i === s.i ? 'now' : '');
        })),
      h('div', { class: 'meta' },
        h('span', { class: 'count', text: 'Question ' + (s.i + 1) + ' of ' + s.ids.length }),
        h('span', { class: 'chip', text: labels[s.kind] + ' · ' + q.t })),
      h('h1', { class: 'question', text: q.q }),
      opts
    ];

    if (res) {
      nodes.push(h('section', { class: 'why' + (res.ok ? '' : ' miss'), id: 'why', role: 'status' },
        h('h2', { text: res.ok ? 'Correct' : 'Not quite' }),
        res.ok ? null : h('p', { class: 'ans', text: 'The answer is ' + LETTERS[order.indexOf(0)] + '.' }),
        h('p', { text: q.e })));
      nodes.push(h('div', null, h('button', { class: 'btn btn-primary', id: 'go', type: 'button', onclick: next,
        text: s.i + 1 >= s.ids.length ? 'See results' : 'Next question' })));
    } else {
      nodes.push(h('div', null, h('button', { class: 'btn btn-primary', id: 'go', type: 'button', disabled: sel == null,
        onclick: check, text: 'Check answer' })));
    }
    return nodes;
  }

  function renderDone() {
    if (!summary) { view = 'home'; return renderHome(); }
    var total = summary.ids.length;
    var right = summary.res.filter(function (r) { return r && r.ok; }).length;
    var pct = right / total, sk = streak(), doneToday = isDone(today());
    var title = pct === 1 ? 'Clean sweep.' : (pct >= 0.72 ? 'Above the passing line.' : 'Below the passing line.');
    var lede = pct === 1 ? 'Every one right.'
      : (pct >= 0.72 ? 'The Series 7 passing score is 72%. This set cleared it.'
                     : 'The Series 7 passing score is 72%. Read through the misses below, they will come back around.');

    var misses = [];
    summary.ids.forEach(function (id, i) {
      var r = summary.res[i], q = byId[id];
      if (q && r && !r.ok) misses.push(h('li', null,
        h('p', { class: 'rq', text: q.q }),
        h('p', { class: 'ra' }, h('span', { text: 'Answer: ' }), q.c[0])));
    });

    var nodes = [
      h('div', { class: 'head' },
        h('div', { class: 'eyebrow', text: { daily: 'Today’s ten', extra: 'Extra practice', missed: 'Missed questions' }[summary.kind] + ' · Results' }),
        h('div', { class: 'score pop' },
          h('span', { class: 'score-num', text: String(right) }),
          h('span', { class: 'score-of', text: 'of ' + total + ' correct' })),
        h('h1', { text: title }),
        h('p', { class: 'lede', text: lede })),
      ticks(total, function (i) { var r = summary.res[i]; return r && r.ok ? 'good' : 'bad'; }),
      h('div', { class: 'card streak-line' },
        h('b', { text: String(sk) }),
        h('span', { text: (sk === 1 ? 'day' : 'days') + ' in a row' + (doneToday ? '. Today is counted.' : '. Finish today’s 10 to add to it.') })),
      h('div', { class: 'btn-row split' },
        h('button', { class: 'btn btn-primary', type: 'button', onclick: function () { summary = null; view = 'home'; render(); window.scrollTo(0, 0); }, text: 'Back to home' }),
        h('button', { class: 'btn btn-ghost', type: 'button', onclick: function () { summary = null; start('extra'); },
          text: doneToday ? 'Do 10 more (optional)' : 'Finish today’s 10' }))
    ];
    if (misses.length) {
      nodes.push(h('h2', { class: 'section-title', text: 'What you missed' }));
      nodes.push(h('ul', { class: 'review card' }, misses));
    }
    return nodes;
  }

  function render() {
    var nodes;
    if (!BANK.length) {
      nodes = [h('div', { class: 'head' },
        h('div', { class: 'eyebrow', text: 'Series 7 · Daily Ten' }),
        h('h1', { text: 'The question bank did not load.' }),
        h('p', { class: 'lede', text: 'Check your connection and reload the page.' }))];
    } else {
      nodes = view === 'quiz' ? renderQuiz() : (view === 'done' ? renderDone() : renderHome());
    }
    if (view !== 'home') confirmReset = false;
    app.textContent = '';
    nodes.forEach(function (n) { if (n) app.appendChild(n); });
  }

  /* ---------- keyboard: A to D or 1 to 4 picks, Enter confirms ---------- */
  document.addEventListener('keydown', function (e) {
    if (view !== 'quiz' || !state.session || e.metaKey || e.ctrlKey || e.altKey) return;
    var s = state.session, k = e.key.toLowerCase();
    var idx = 'abcd'.indexOf(k); if (idx < 0) idx = '1234'.indexOf(k);
    if (k.length === 1 && idx >= 0 && !s.res[s.i]) { sel = idx; render(); return; }
    if (k === 'enter' && !(e.target && e.target.tagName === 'BUTTON')) {
      if (s.res[s.i]) next(); else if (sel != null) check();
    }
  });

  /* Coming back to the tab after midnight should show the new day. */
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && view === 'home') render();
  });

  dropStaleSession();
  render();
})();
</script>
</body>
</html>
